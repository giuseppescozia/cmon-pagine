<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detta la nota</title>
<style>
:root{--fg:#16203f;--mu:#5f6880;--li:#e3e7f0;--nv:#13286b;--rd:#d6192b;--so:#f4f6fb}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Arial,Helvetica,sans-serif;color:var(--fg);background:#fff}
.w{max-width:520px;margin:0 auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:100vh}
h1{font-size:18px;margin:0}.mu{color:var(--mu);font-size:13.5px}
#mic{align-self:center;width:96px;height:96px;border-radius:50%;border:0;background:var(--nv);color:#fff;display:grid;place-items:center;cursor:pointer;margin:6px 0}
#mic.on{background:var(--rd);animation:p 1.2s infinite}#mic svg{width:40px;height:40px}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(214,25,43,.45)}70%{box-shadow:0 0 0 18px rgba(214,25,43,0)}100%{box-shadow:0 0 0 0 rgba(214,25,43,0)}}
#st{text-align:center;font-weight:700;color:var(--nv)}
textarea{width:100%;min-height:170px;border:1.5px solid var(--li);border-radius:12px;padding:12px;font:16px/1.45 Arial,sans-serif;color:var(--fg);resize:vertical}
.az{display:flex;gap:8px}.az button{flex:1;border:0;border-radius:10px;padding:13px;font:700 15px Arial;cursor:pointer}
.b1{background:var(--rd);color:#fff}.b2{background:var(--so);color:var(--fg)}
.err{background:#fde8ea;color:#9b1020;border-radius:10px;padding:10px 12px;font-size:14px}
</style></head><body><div class="w">
<h1>Detta la nota</h1>
<div class="mu">Tocca il microfono e parla. Il testo compare qui sotto: puoi correggerlo, poi premi "Usa" e torna nel gestionale.</div>
<button id="mic" aria-label="Parla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4M8 22h8"/></svg></button>
<div id="st">Tocca per parlare</div>
<textarea id="tx" placeholder="Qui compare quello che dici"></textarea>
<div id="msg"></div>
<div class="az"><button class="b2" id="copia">Copia</button><button class="b1" id="usa">Usa</button></div>
</div>
<script>
/* Pagina per dettare (Giuseppe 13/11): il gestionale su Google non può usare il microfono; questa pagina sì.
   Il testo torna alla finestra del gestionale che l'ha aperta (postMessage); se non può, si copia e si incolla. */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=null,base='',id=(location.search.match(/[?&]id=([\w-]+)/)||[])[1]||'';
function $(q){return document.querySelector(q)}
function msg(t){$('#msg').innerHTML=t?'<div class="err">'+t+'</div>':''}
function ferma(){if(r){try{r.stop()}catch(e){}}}
function parla(){if(!SR){msg('Questo browser non sa dettare: usa Chrome, Edge o Safari, oppure il microfono della tastiera del telefono.');return}
  if(r){ferma();return}
  r=new SR();r.lang='it-IT';r.continuous=true;r.interimResults=true;base=$('#tx').value;var sep=base&&!/\s$/.test(base)?' ':'',fin='';
  $('#mic').classList.add('on');$('#st').textContent='Sto ascoltando: tocca per fermare';msg('');
  r.onresult=function(e){var tmp='';for(var i=e.resultIndex;i<e.results.length;i++){var x=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=x;else tmp+=x}
    var t=(fin+tmp).trim();if(t)t=t.charAt(0).toUpperCase()+t.slice(1);$('#tx').value=base+sep+t};
  r.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed')msg('Il browser non ha dato il permesso al microfono: consentilo (icona nella barra dell\'indirizzo) e riprova.');else if(e.error==='no-speech')msg('Non ho sentito niente: riprova.')};
  r.onend=function(){r=null;$('#mic').classList.remove('on');$('#st').textContent='Tocca per parlare'};
  try{r.start()}catch(e){r=null}}
$('#mic').onclick=parla;
$('#copia').onclick=function(){var v=$('#tx').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){$('#st').textContent='Copiato: incollalo nella nota'}).catch(function(){$('#tx').select()})};
$('#usa').onclick=function(){ferma();var v=$('#tx').value.trim();if(!v){msg('Non c\'è ancora niente da usare.');return}
  if(window.opener){try{window.opener.postMessage({tipo:'cmon-voce',id:id,testo:v},'*');window.close();return}catch(e){}}
  $('#copia').click();msg('Non riesco a rimandarlo da solo: è copiato, incollalo nella nota.')};
setTimeout(parla,300);
</script></body></html>
