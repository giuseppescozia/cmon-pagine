<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scheda immobile</title>
<style>
:root{--fg:#16203f;--mu:#5f6880;--li:#e3e7f0;--nv:#13286b;--rd:#d6192b;--bl:#1d4fd8;--gr:#139a55;--so:#f4f6fb}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--fg);font:15px/1.5 Arial,Helvetica,sans-serif}
.w{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--li)}
.top img{max-height:46px;max-width:200px;display:block}.top b{color:var(--nv);font-size:17px}.rif{color:var(--mu);font-size:12.5px;text-align:right}
.pad{padding:16px}
h1{font-size:21px;line-height:1.25;margin:0 0 4px}.loc{font-weight:700;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--nv)}
.pz{font-weight:800;font-size:24px;color:var(--nv);margin:6px 0 4px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#0d1426}.gal::-webkit-scrollbar{display:none}
.gal div{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:3/2;max-height:460px}.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal span{position:absolute;left:10px;bottom:10px;background:rgba(10,15,30,.66);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px}
.cnt{text-align:center;color:var(--mu);font-size:12px;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:6px;margin:12px 0}.facts div{background:var(--so);border-radius:10px;text-align:center;padding:8px 4px}.facts b{display:block;font-size:17px}.facts small{color:var(--mu);font-size:11.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;padding-bottom:2px}.tabs button{flex:none;border:0;background:var(--so);color:var(--fg);font:700 13px Arial;padding:7px 12px;border-radius:16px}.tabs button.on{background:var(--nv);color:#fff}
.amb{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.amb img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:8px;display:block}.amb small{display:block;font-weight:700;margin:3px 2px 0}
.car div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef0f5;padding:7px 0;font-size:14px}.car span{color:var(--mu)}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:14px;font:800 15px Arial;margin-top:10px;cursor:pointer;text-decoration:none}
.b1{background:var(--rd);color:#fff}.b2{background:#fff;color:var(--nv);border:1.5px solid var(--nv)}.b3{background:var(--gr);color:#fff}
.ag{display:flex;gap:12px;align-items:center;background:var(--so);border-radius:12px;padding:12px;margin-top:16px}.ag img,.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}.av{background:var(--nv);color:#fff;display:grid;place-items:center;font-weight:800}
.ag a{color:var(--bl);font-weight:700;text-decoration:none;margin-right:12px}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--li);cursor:pointer}.ck input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--bl)}.ck small{display:block;color:var(--mu);font-size:12.5px}
.inf{white-space:pre-line;background:var(--so);border-radius:10px;padding:12px;font-size:13px;color:#33405e;margin:8px 0;max-height:300px;overflow:auto}
.ok{background:#e4f6ec;color:#0c6b3a;border-radius:12px;padding:14px;margin-top:12px;font-weight:700}
.err{background:#fde9eb;color:#9b1020;border-radius:12px;padding:12px;margin-top:10px}
.foot{color:var(--mu);font-size:12px;text-align:center;padding:20px 16px 30px}.foot button{background:none;border:0;color:var(--bl);font:inherit;text-decoration:underline;cursor:pointer}
textarea{width:100%;border:1.5px solid var(--li);border-radius:10px;padding:10px;font:14px Arial;min-height:70px}
.map{position:relative;width:256px;height:256px;border-radius:10px;overflow:hidden;margin:0 auto}.map img{position:absolute;width:128px;height:128px}.map i{position:absolute;border-radius:50%;background:rgba(29,79,216,.2);border:2px solid rgba(29,79,216,.65)}
.plan img{width:100%;border:1px solid var(--li);border-radius:8px;margin-top:8px;background:#fff}
.box{background:var(--so);border-radius:12px;padding:14px;margin:12px 0}.when{font-weight:800;font-size:18px}.meta{color:var(--mu);font-size:13px}
.lnk{display:inline-block;margin-top:8px;color:var(--bl);font-weight:700;text-decoration:none}
.ore{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ore span{background:#fff;border:1.5px solid var(--li);border-radius:10px;padding:5px 10px;font-weight:800}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--li);background:#fff;border-radius:12px;padding:12px 14px;font:700 14px Arial;margin-top:8px;cursor:pointer;color:var(--fg)}.opt.on{border-color:var(--bl);background:#eef3fe}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1.5px solid var(--li);background:#fff;border-radius:16px;padding:6px 12px;font:700 13px Arial;cursor:pointer;color:var(--fg)}.chip.on{background:var(--nv);border-color:var(--nv);color:#fff}
.box input,#vd input{width:100%;border:1.5px solid var(--li);border-radius:10px;padding:10px;font:14px Arial}
</style></head><body><div class="w" id="app"></div>
<script>
var D=/*DATI*/null,API='https://script.google.com/macros/s/AKfycby9Cq9WauFadqGQ00uPIv1dknVyWEnSvXnDMSeqMU2_pQPhJc_MRssHIsKxyf1eLJD8/exec';
function chiama(fn,args,ok,ko){ko=ko||function(){};
  if(window.google&&google.script&&google.script.run){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(ko);r[fn].apply(r,args);return}
  var p=fn==='clienteFoto'?fetch(API+'?api=foto&k='+encodeURIComponent(args[0])+'&u='+encodeURIComponent(JSON.stringify(args[1])),{credentials:'omit'})
    :fetch(API,{method:'POST',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({api:fn,k:args[0],a:args.slice(1)})});
  p.then(function(r){return r.json()}).then(function(o){if(o.errore)throw new Error(o.errore);ok(o.r)}).catch(function(x){ko({message:x&&x.message?x.message:'Connessione non riuscita, riprovi.'})})}
var VU='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==',FC={},FA={},FQ=[],FN=0;
function foto(prima){var nuove=[];document.querySelectorAll('img[data-u]').forEach(function(i){var u=i.getAttribute('data-u');if(FC[u]){i.src=FC[u];i.removeAttribute('data-u')}else if(prima&&FA[u]===2&&FQ.indexOf(u)>=0){FQ.splice(FQ.indexOf(u),1);nuove.push(u);FA[u]=1}else if(!FA[u]){FA[u]=1;nuove.push(u)}});FQ=prima?nuove.concat(FQ):FQ.concat(nuove);fotoGiro()}
/* dopo le prime foto della galleria si preparano già ambienti e planimetria, così quando si apre la linguetta sono pronte */
function fotoDopo(){var d=D.d||{},l=(d.amb||[]).map(function(x){return x.u}).concat(d.plan||[]),i=Math.min(3,FQ.length);l.forEach(function(u){if(!FA[u]&&!FC[u]){FA[u]=2;FQ.splice(i++,0,u)}});fotoGiro()}
function fotoGiro(){while(FN<3&&FQ.length){var b=FQ.splice(0,3);FN++;chiama('clienteFoto',[D.token,b],function(b){return function(r){FN--;var a=[];try{a=JSON.parse(r)}catch(x){}b.forEach(function(u,i){if(a[i])FC[u]=a[i]});foto()}}(b),function(){FN--;fotoGiro()})}}
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(q){return document.querySelector(q)}
var tab='descr',stato={privacy:D?D.privacy:null};
function testa(){var d=D.d||{};return '<div class="top">'+(D.logo?'<img src="'+D.logo+'" alt="'+e(D.agenzia)+'">':'<b>'+e(D.agenzia)+'</b>')+'<div class="rif">Riferimento<br><b style="color:#16203f;font-size:14px">'+e(d.rif||'')+'</b></div></div>'}
function piede(){return '<div class="foot">'+e(D.agenzia)+(stato.privacy&&stato.privacy.informativa?' · <button onclick="privacy(true)">Le sue scelte sulla privacy</button>':'')+'</div>'}
function privacy(rivedi){var p=stato.privacy||{},d=D.d||{};
  $('#app').innerHTML=testa()+'<div class="pad"><div style="font-weight:800;font-size:18px;margin-bottom:4px">'+(D.nome?'Buongiorno '+e(String(D.nome).split(' ')[0].charAt(0)+String(D.nome).split(' ')[0].slice(1).toLowerCase()):'Buongiorno')+'</div>'
   +'<div style="color:#5f6880;font-size:14px">'+(rivedi?'Qui può cambiare le sue scelte in qualsiasi momento.':e(D.agente.nome||'L\'agenzia')+' le ha mandato '+(D.d&&D.d.tipo==='app'?'i dettagli del vostro appuntamento':'la scheda di un immobile')+'. Prima di aprirla, ci serve la presa visione dell\'informativa sulla privacy.')+'</div>'
   +'<label class="ck"><input type="checkbox" id="c1" '+(p.informativa?'checked':'')+'><span><b>Ho letto l\'informativa sulla privacy</b> <a href="#" id="leggi" style="color:#1d4fd8">leggi</a><small>Necessaria per vedere la scheda</small></span></label><div class="inf" id="inf" hidden>'+e(D.informativa)+'</div>'
   +'<label class="ck"><input type="checkbox" id="c2" '+(p.avvisi?'checked':'')+'><span><b>Avvisatemi quando entra un immobile adatto alla mia ricerca</b><small>Facoltativo · solo immobili simili a quello che cerca</small></span></label>'
   +'<label class="ck"><input type="checkbox" id="c3" '+(p.novita?'checked':'')+'><span><b>Novità e iniziative dell\'agenzia</b><small>Facoltativo · eventi, servizi, promozioni</small></span></label>'
   +'<button class="btn b1" id="vai">'+(rivedi?'Salva le scelte':D.d&&D.d.tipo==='app'?'Continua':'Apri la scheda')+'</button><div id="msg"></div>'
   +'<div style="color:#5f6880;font-size:12.5px;text-align:center;margin-top:10px">Può cambiare le scelte in qualsiasi momento dal fondo della pagina.</div></div>';
  $('#leggi').onclick=function(ev){ev.preventDefault();$('#inf').hidden=!$('#inf').hidden};
  $('#vai').onclick=function(){if(!$('#c1').checked){$('#msg').innerHTML='<div class="err">Per vedere la scheda serve la presa visione dell\'informativa.</div>';return}
    var b=this;b.disabled=true;b.textContent='Un momento…';
    chiama('clienteConsensi',[D.token,{informativa:true,avvisi:$('#c2').checked,novita:$('#c3').checked}],function(r){stato.privacy=JSON.parse(r);vista()},function(x){b.disabled=false;b.textContent='Riprova';$('#msg').innerHTML='<div class="err">'+e(x.message||x)+'</div>'})}}
function vista(){if(D.d&&D.d.tipo==='app')appunt();else scheda()}
function nomeC(){var n=String(D.nome||'').split(' ')[0];return n?n.charAt(0)+n.slice(1).toLowerCase():''}
function saluto(){var n=nomeC();return 'Buongiorno'+(n?' '+e(n):'')+', '}
function quandoT(s,ora){var d=new Date(s);if(isNaN(d))return '';var t=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});t=t.charAt(0).toUpperCase()+t.slice(1);if(ora!==false&&String(s).length>10)t+=' · ore '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});return t}
function oraT(s){var d=new Date(s);return isNaN(d)?'':d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
function agCard(){var ag=D.agente||{},tel=String(ag.tel||'').replace(/\D/g,''),wa=tel?'https://wa.me/'+(tel.indexOf('39')===0?tel:'39'+tel):'';
  return '<div class="ag">'+(ag.foto?'<img src="'+ag.foto+'" alt="">':'<div class="av">'+e(String(ag.nome||'?').split(' ').map(function(x){return x.charAt(0)}).slice(0,2).join(''))+'</div>')+'<div><b>'+e(ag.nome)+'</b><div style="color:#5f6880;font-size:13px">'+e(D.agenzia)+'</div><div style="margin-top:4px">'+(tel?'<a href="tel:+'+(tel.indexOf('39')===0?tel:'39'+tel)+'">Chiama</a><a href="'+wa+'" target="_blank" rel="noopener">WhatsApp</a>':'')+(ag.mail?'<a href="mailto:'+e(ag.mail)+'">Mail</a>':'')+'</div></div></div>'}
/* appuntamento: conferma (o avviso), riepilogo delle visite per il proprietario, e dopo la visita il riscontro */
function appunt(){var d=D.d||{},fine=Date.parse(d.fine||d.quando),dopo=d.modo==='riscontro'||(d.ruolo==='cliente'&&/VISITA/i.test(d.tipoApp||'')&&!isNaN(fine)&&Date.now()>fine+30*60000);
  if(dopo)return riscontro();
  var tipoL=/VISITA/i.test(d.tipoApp||'')?'Visita':/STIMA|ACQUISIZIONE/i.test(d.tipoApp||'')?'Valutazione dell\'immobile':'Appuntamento';
  var maps=d.luogo?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.luogo):'',chiedi=d.modo==='chiedi'||d.modo==='riepilogo';
  var h=testa()+'<div class="pad"><div style="font-size:16px">'+saluto()+(d.modo==='chiedi'?'le confermo il nostro appuntamento:':d.modo==='riepilogo'?'ecco le visite in programma al suo immobile:':'le ricordo il nostro appuntamento:')+'</div>';
  if(d.modo==='riepilogo')h+='<div class="box"><div class="when">'+e(quandoT(d.quando,false))+'</div><div class="meta">'+e((d.imm&&d.imm.titolo)||'')+(d.luogo?'<br>'+e(d.luogo):'')+'</div><div class="ore">'+(d.visite||[]).map(function(v){return '<span>'+e(oraT(v.quando))+'</span>'}).join('')+'</div><div class="meta" style="margin-top:6px">'+(d.visite||[]).length+((d.visite||[]).length===1?' visita':' visite')+'</div></div>';
  else h+='<div class="box"><div class="when">'+e(quandoT(d.quando))+'</div><div class="meta">'+e(tipoL)+(d.imm&&d.imm.titolo?' · '+e(d.imm.titolo):'')+(d.luogo?'<br>'+e(d.luogo):'')+'</div>'+(maps?'<a class="lnk" href="'+maps+'" target="_blank" rel="noopener">Apri in Maps</a>':'')+'</div>';
  if(chiedi)h+='<div id="cf"><div style="font-weight:700;margin-top:6px">'+(d.modo==='riepilogo'?'Ci conferma le visite?':'Ci conferma la sua presenza?')+'</div><button class="btn b3" id="si">'+(d.modo==='riepilogo'?'Sì, confermo':'Sì, ci sarò')+'</button><button class="btn b2" id="sp">'+(d.modo==='riepilogo'?'Devo spostare qualcosa':'Devo spostarlo')+'</button></div>';
  h+=vendeHtml(d)+agCard()+'</div>'+piede();$('#app').innerHTML=h;
  var ag=(D.agente&&D.agente.nome)||'L\'agente';
  if(chiedi){$('#si').onclick=function(){var b=this;b.disabled=true;b.textContent='Un momento…';chiama('clienteConferma',[D.token,'si',''],function(){$('#cf').innerHTML='<div class="ok">Grazie, a presto!</div>'},function(x){b.disabled=false;b.textContent='Riprova'})};
    $('#sp').onclick=function(){$('#cf').innerHTML='<div style="font-weight:700;margin-top:6px">Quando le andrebbe meglio?</div><textarea id="spn" placeholder="Giorni e orari comodi (facoltativo)"></textarea><button class="btn b1" id="spi">Invia</button>';
      $('#spi').onclick=function(){var b=this;b.disabled=true;b.textContent='Invio…';chiama('clienteConferma',[D.token,'sposta',$('#spn').value],function(){$('#cf').innerHTML='<div class="ok">Grazie, '+e(ag)+' la ricontatterà per trovare un altro momento.</div>'},function(x){b.disabled=false;b.textContent='Riprova'})}}}
  bindVende()}
function vendeHtml(d){var v=d.vende;if(!v)return '';
  if(v.chiedi==='indirizzo')return '<div class="box" id="vd"><b>Per la casa che vende'+(v.zona?' in zona '+e(v.zona):'')+'</b><div class="meta" style="margin:4px 0 8px">Se vuole, ci lasci l\'indirizzo e le portiamo una valutazione all\'appuntamento.</div><input id="vi" placeholder="Via e numero civico"><button class="btn b2" id="vs">Invia</button></div>';
  return '<div class="box" id="vd"><b>Ha una casa da vendere?</b><div class="meta" style="margin:4px 0 8px">Se vuole, le prepariamo una valutazione gratuita.</div><button class="btn b2" id="vy">Sì, mi interessa</button></div>'}
function bindVende(){var y=$('#vy');if(y)y.onclick=function(){$('#vd').innerHTML='<b>Dove si trova la casa?</b><input id="vi" placeholder="Via, numero civico e comune" style="margin-top:8px"><textarea id="vn" placeholder="Qualcosa da aggiungere? (facoltativo)"></textarea><button class="btn b1" id="vs">Invia</button>';bs()};bs();
  function bs(){var b=$('#vs');if(!b)return;b.onclick=function(){var ind=($('#vi')||{}).value||'';if(!ind.trim()){$('#vi').focus();return}b.disabled=true;b.textContent='Invio…';
    chiama('clienteVende',[D.token,{indirizzo:ind,nota:($('#vn')||{}).value||''}],function(){$('#vd').innerHTML='<div class="ok">Grazie! Le prepariamo la valutazione.</div>'},function(x){b.disabled=false;b.textContent='Riprova'})}}}
function riscontro(){var d=D.d||{},es='',mot=[];
  $('#app').innerHTML=testa()+'<div class="pad"><div style="font-size:16px">'+saluto()+'grazie per la visita'+(d.imm&&d.imm.via?' in '+e(d.imm.via):'')+'. Com\'è andata?</div><div id="rs">'
    +[['proposta','Mi interessa, vorrei fare una proposta'],['rivedere','Vorrei rivederlo'],['pensare','Ci sto pensando'],['no','Non fa per me']].map(function(o){return '<button class="opt" data-o="'+o[0]+'">'+o[1]+'</button>'}).join('')
    +'<div id="mt" hidden><div class="meta" style="margin:12px 0 6px">Cosa non la convince? (se vuole)</div><div class="chips">'+['Prezzo','Zona','Spazi','Stato','Piano','Altro'].map(function(m){return '<button class="chip" data-m="'+m+'">'+m+'</button>'}).join('')+'</div></div>'
    +'<textarea id="rn" placeholder="Un commento (facoltativo)"></textarea><button class="btn b1" id="ri" disabled>Invia</button></div>'+agCard()+'</div>'+piede();
  document.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){es=b.getAttribute('data-o');document.querySelectorAll('[data-o]').forEach(function(x){x.className='opt'+(x===b?' on':'')});$('#mt').hidden=!(es==='pensare'||es==='no');$('#ri').disabled=false}});
  document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){var m=b.getAttribute('data-m'),i=mot.indexOf(m);if(i<0)mot.push(m);else mot.splice(i,1);b.className='chip'+(mot.indexOf(m)>=0?' on':'')}});
  $('#ri').onclick=function(){var b=this;b.disabled=true;b.textContent='Invio…';chiama('clienteRiscontro',[D.token,{esito:es,motivi:mot,nota:$('#rn').value}],function(){$('#rs').innerHTML='<div class="ok">Grazie per il suo riscontro!'+(es==='proposta'||es==='rivedere'?' '+e((D.agente&&D.agente.nome)||'L\'agente')+' la ricontatterà a breve.':'')+'</div>'},function(x){b.disabled=false;b.textContent='Riprova'})}}
function scheda(){var d=D.d||{},f=d.foto||[];
  var gal=f.length?'<div class="gal" id="gal">'+f.map(function(x){return '<div><img src="'+VU+'" data-u="'+e(x.u)+'" alt="'+e(x.c||'')+'">'+(x.c?'<span>'+e(x.c)+'</span>':'')+'</div>'}).join('')+'</div><div class="cnt" id="cnt">1 / '+f.length+' · scorra per vedere le foto</div>':'';
  var tabs=[['descr','Descrizione',d.descr],['amb','Ambienti',(d.amb||[]).length],['car','Caratteristiche',(d.car||[]).length||d.classe],['plan','Planimetria',(d.plan||[]).length],['zona','Zona',d.mappa]].filter(function(t){return t[2]});
  if(!tabs.some(function(t){return t[0]===tab})&&tabs.length)tab=tabs[0][0];
  var ag=D.agente||{},tel=String(ag.tel||'').replace(/\D/g,''),wa=tel?'https://wa.me/'+(tel.indexOf('39')===0?tel:'39'+tel):'';
  $('#app').innerHTML=testa()+gal+'<div class="pad"><h1>'+e(d.titolo)+'</h1><div class="loc">'+e(d.luogo)+'</div>'+(d.prezzo?'<div class="pz">'+e(d.prezzo)+'</div>':'')
   +((d.facts||[]).length?'<div class="facts">'+d.facts.map(function(x){return '<div><b>'+e(x[0])+'</b><small>'+e(x[1])+'</small></div>'}).join('')+'</div>':'')
   +(tabs.length?'<div class="tabs">'+tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div><div id="corpo">'+corpo(d)+'</div>':'')
   +'<div id="vis"><button class="btn b1" id="visita">Vorrei visitarlo</button></div>'

  document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){tab=b.getAttribute('data-t');document.querySelectorAll('[data-t]').forEach(function(x){x.className=x===b?'on':''});$('#corpo').innerHTML=corpo(d);foto(true)}});
